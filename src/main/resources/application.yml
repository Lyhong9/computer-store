spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: projectjava

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/computer_ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  cache:
    type: caffeine
    cache-names:
      - products
      - users
    caffeine:
      spec: "maximumSize=1000,expireAfterAccess=5m"

server:
  port: ${SERVER_PORT:8083}
  error:
    include-stacktrace: never

app:
  jwt:
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  admin:
    enabled: ${ADMIN_ENABLED:false}
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:}

